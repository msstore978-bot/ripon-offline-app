name: Build & Deploy (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Node.js
      # ==========================================
      # IMPORTANT:
      # No npm cache here because this project
      # does not currently contain package-lock.json.
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # ==========================================
      # 3. Install dependencies
      # ==========================================
      # npm install works without package-lock.json.
      # ==========================================
      - name: Install dependencies
        run: npm install


      # ==========================================
      # 4. Verify repository structure
      # ==========================================
      - name: Verify repository files
        shell: bash
        run: |
          echo "========================================"
          echo "Repository"
          echo "========================================"

          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "apps-script files:"

          if [ ! -d "apps-script" ]; then
            echo "ERROR: apps-script directory not found!"
            exit 1
          fi

          ls -la apps-script

          echo ""
          echo "Checking required files..."

          test -f "apps-script/Code.gs" \
            || { echo "ERROR: Code.gs not found"; exit 1; }

          test -f "apps-script/Barcode.gs" \
            || { echo "ERROR: Barcode.gs not found"; exit 1; }

          test -f "apps-script/Api.gs" \
            || { echo "ERROR: Api.gs not found"; exit 1; }

          test -f "apps-script/Index.html" \
            || { echo "ERROR: Index.html not found"; exit 1; }

          echo ""
          echo "========================================"
          echo "ALL REQUIRED FILES FOUND"
          echo "========================================"


      # ==========================================
      # 5. Run tests
      # ==========================================
      - name: টেস্ট (Code.gs + অফলাইন সিঙ্ক)
        run: npm test


      # ==========================================
      # 6. Build application
      # ==========================================
      - name: অ্যাপ বিল্ড
        run: node build.mjs


      # ==========================================
      # 7. Verify dist
      # ==========================================
      - name: Verify build output
        shell: bash
        run: |
          echo "========================================"
          echo "Checking dist directory"
          echo "========================================"

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created!"
            exit 1
          fi

          ls -la dist

          echo ""
          echo "Build output verified successfully."


      # ==========================================
      # 8. Configure GitHub Pages
      # ==========================================
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      # ==========================================
      # 9. Upload Pages artifact
      # ==========================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


      # ==========================================
      # 10. Save build artifact
      # ==========================================
      - name: বিল্ডের কপি
        uses: actions/upload-artifact@v4
        with:
          name: ripon-offline-app
          path: ./dist


  # ============================================
  # DEPLOY
  # ============================================
  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
