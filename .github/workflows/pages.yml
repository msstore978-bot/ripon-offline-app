name: Build & Deploy (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify package files
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f build.mjs
          test -f tests/harness.js
          test -f apps-script/Code.gs
          test -f apps-script/Barcode.gs
          test -f apps-script/Api.gs
          test -f apps-script/Index.html
          test -f web/index.html
          echo "Repository structure OK."

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/version.json
          test -f dist/gas/Code.gs.txt
          test -f dist/gas/Barcode.gs.txt
          echo "Build output OK."
          find dist -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ripon-offline-app
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
