<!DOCTYPE html>
<html lang="bn">
<head>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="রিপন">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2F33">
<title>স্টক ম্যানেজমেন্ট ও POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B2F33; --ink-2:#123F45; --primary:#0E5A5F; --primary-d:#0A484C; --primary-50:#E5F0F0;
  --brass:#C9A24B; --brass-50:#F6EDD6;
  --bg:#F2F5F5; --card:#fff; --text:#16262A; --muted:#64777D; --line:#E1E8EA; --line-2:#CBD6D9;
  --ok:#1B8A5A; --ok-50:#E2F3EA; --bad:#C23B2E; --bad-50:#FBE8E5; --warn:#B96508; --warn-50:#FCEFD9;
  --side:264px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
h1{font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600}
h3{font-size:16px;font-weight:600}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pos-c{color:var(--ok)} .neg-c{color:var(--bad)}
.ic{flex:none}

/* ---------- top progress + splash ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;overflow:hidden;opacity:0;transition:opacity .2s}
#bar.on{opacity:1}
#bar::after{content:"";position:absolute;inset:0;width:38%;background:var(--brass);animation:slide 1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
#splash{position:fixed;inset:0;z-index:90;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#splash svg{width:84px;height:84px;color:var(--brass)}
#splash .hand{transform-origin:100px 100px;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#splash p{opacity:.85}

/* ---------- layout ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--ink);color:#C9DADB;display:flex;flex-direction:column;z-index:40;transform:translateX(-100%);transition:transform .24s ease}
.nav-open .sidebar{transform:none}
.scrim-nav{position:fixed;inset:0;background:rgba(6,24,27,.5);z-index:35;display:none}
.nav-open .scrim-nav{display:block}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-logo{width:44px;height:44px;border-radius:50%;background:var(--ink-2);border:1.5px solid var(--brass);display:grid;place-items:center;color:var(--brass);overflow:hidden;flex:none}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-name{color:#fff;font-weight:600;font-size:16.5px;line-height:1.25;overflow-wrap:anywhere}
.brand-sub{font-size:12.5px;color:#89A5A8}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:10px;color:#C9DADB;font-weight:500;text-align:left;width:100%}
.nav-item:hover{background:rgba(255,255,255,.05)}
.nav-item.active{background:rgba(255,255,255,.09);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--brass)}
.nav-item .badge-n{margin-left:auto;background:var(--warn);color:#fff;border-radius:999px;font-size:12px;padding:0 8px;line-height:20px;font-weight:600}
.nav-foot{padding:14px 18px;font-size:12.5px;color:#7F9C9F;border-top:1px solid rgba(255,255,255,.08)}
.main{min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;height:56px;padding:0 8px;background:#fff;border-bottom:1px solid var(--line)}
.topbar .t-title{font-weight:600;font-size:17px}
.topbar .t-shop{margin-left:auto;font-size:13px;color:var(--muted);max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.content{padding:16px 14px 40px;max-width:1220px;margin:0 auto}
@media (min-width:1024px){
  .sidebar{transform:none}
  .main{margin-left:var(--side)}
  .topbar,.scrim-nav{display:none!important}
  .content{padding:28px 32px 56px}
  .only-mobile{display:none!important}
}
@media (max-width:1023px){ .only-desktop{display:none!important} }

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head .sub{color:var(--muted);font-size:14px;margin-top:2px}
.page-head.tight{margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font-weight:600;background:#fff;border:1px solid var(--line-2);color:var(--text);text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#F5F8F8}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#2A2007}
.btn.danger{color:var(--bad);border-color:#E9C2BD}
.btn.danger:hover{background:var(--bad-50)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:9px}
.btn.lg{min-height:52px;font-size:17px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.loading{position:relative;color:transparent!important;pointer-events:none}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
.btn:not(.primary):not(.brass).loading::after{border-color:rgba(0,0,0,.15);border-top-color:var(--primary)}
.icon-btn{width:44px;height:44px;border-radius:10px;display:inline-grid;place-items:center;color:inherit;flex:none}
.icon-btn:hover{background:rgba(120,140,145,.14)}
.icon-btn.sm{width:36px;height:36px}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,90,95,.14)}
.inp:disabled{background:#F1F4F4;color:var(--muted)}
select.inp{padding-right:8px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label{font-size:13.5px;font-weight:500;color:#3A4E53}
.fld .req{color:var(--bad)}
.hint{font-size:13px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .span2{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.calc-hint{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--brass-50);color:#5B4611;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:12px;background:#EBF0F0;gap:4px}
.seg button{min-height:40px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.searchbar{position:relative;display:flex;align-items:center}
.searchbar>.ic{position:absolute;left:14px;color:var(--muted);pointer-events:none}
.searchbar .inp{padding-left:44px;padding-right:44px}
.searchbar .icon-btn{position:absolute;right:2px}
.searchbar.big .inp{min-height:52px;border-radius:14px;font-size:16px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.split-eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start;margin-bottom:16px}
@media (max-width:900px){.split,.split-eq{grid-template-columns:1fr}}
.sec-title{font-size:15px;font-weight:600;color:var(--muted);margin:26px 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.one{grid-template-columns:1fr}}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.stat-top{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;font-weight:500}
.chip-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.t-ok{background:var(--ok-50);color:var(--ok)} .t-bad{background:var(--bad-50);color:var(--bad)}
.t-pri{background:var(--primary-50);color:var(--primary)} .t-brass{background:var(--brass-50);color:#8A6A1B} .t-warn{background:var(--warn-50);color:var(--warn)}
.stat-num{font-size:26px;font-weight:600;line-height:1.25;margin-top:10px;letter-spacing:-.01em;overflow-wrap:anywhere}
.stat-sub{font-size:13px;color:var(--muted);margin-top:2px}
.stat .link{margin-top:8px;font-size:13.5px;font-weight:600;color:var(--primary);min-height:32px;padding:0}
@media (max-width:560px){.stat{padding:13px}.stat-num{font-size:20px}}

.hero{position:relative;overflow:hidden;background:var(--ink);color:#fff;border-radius:20px;padding:24px 26px;margin-bottom:12px}
.hero .dial{position:absolute;right:-34px;top:50%;width:230px;height:230px;margin-top:-115px;color:var(--brass);opacity:.3}
.hero-label{font-size:14.5px;color:var(--brass);font-weight:600}
.hero-num{font-size:44px;font-weight:700;line-height:1.2;margin:4px 0 6px;letter-spacing:-.02em;overflow-wrap:anywhere}
.hero-note{font-size:14px;color:#A9C2C4}
.hero.neg .hero-num{color:#FFB4AB}
@media (max-width:560px){.hero{padding:20px}.hero-num{font-size:34px}.hero .dial{width:170px;height:170px;margin-top:-85px;right:-40px}}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;min-width:520px}
.tbl th{font-size:13px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;background:#F6F9F9;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.num{text-align:right}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover{background:#FAFCFC}
.tbl tfoot td{font-weight:600;background:#F6F9F9}
.tbl .acts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.tbl-card{padding:0;overflow:hidden}
.pname{font-weight:600;line-height:1.35}
.badge{display:inline-flex;align-items:center;padding:1px 10px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:22px;white-space:nowrap}
.badge.ok{background:var(--ok-50);color:var(--ok)} .badge.low{background:var(--warn-50);color:var(--warn)} .badge.out{background:var(--bad-50);color:var(--bad)} .badge.grey{background:#EBF0F0;color:var(--muted)}
.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#EDF2F2;flex:none}
.thumb.ph{display:grid;place-items:center;color:#9DB0B4}
.thumb.lg{width:100%;height:auto;aspect-ratio:1;border-radius:14px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty .ic{margin:0 auto 8px;color:#A9BABD}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipb{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:#fff;font-weight:500;font-size:14.5px}
.chipb.on{background:var(--ink);border-color:var(--ink);color:#fff}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .searchbar{flex:1 1 320px}
.more{display:flex;justify-content:center;padding:14px}

/* product cards (mobile) */
.plist{display:grid;gap:10px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.pcard-top{display:flex;gap:12px;align-items:flex-start}
.pcard-top .thumb{width:60px;height:60px}
.pcard-info{flex:1;min-width:0}
.pcard-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;padding:10px 0;border-block:1px dashed var(--line)}
.pcard-meta div{font-size:12.5px;color:var(--muted)}
.pcard-meta b{display:block;font-size:15px;color:var(--text);font-weight:600}
.pcard-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* low-stock list */
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .grow{min-width:0}
.lrow .pname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* image picker */
.imgpick{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.imgprev{width:96px;height:96px;border-radius:14px;border:1.5px dashed var(--line-2);overflow:hidden;display:grid;place-items:center;color:#9DB0B4;background:#F7FAFA}
.imgprev img{width:100%;height:100%;object-fit:cover}
.imgact{display:flex;flex-direction:column;gap:6px;align-items:flex-start;flex:1;min-width:200px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin-top:14px}
.dl dt{color:var(--muted);font-size:14px}
.dl dd{font-weight:500;text-align:right;overflow-wrap:anywhere}

/* tabs */
.tabs{display:flex;gap:4px;padding:4px;background:#E6ECEC;border-radius:12px;margin-bottom:14px;overflow-x:auto}
.tab{flex:1;min-height:42px;padding:0 16px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;padding:14px}
.filters .fld{flex:0 1 160px}
.filters .fld.grow{flex:1 1 220px}

/* ---------- POS ---------- */
.pos{display:block}
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:14px}
@media (max-width:420px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 8px 10px;transition:border-color .15s,transform .1s}
.tile:hover{border-color:var(--primary)}
.tile:active{transform:scale(.98)}
.tile .thumb{width:100%;height:auto;aspect-ratio:1.25;border-radius:9px}
.tile-name{font-weight:600;line-height:1.3;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;padding:0 2px}
.tile-row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 2px;flex-wrap:wrap}
.tile-row b{font-size:16px;color:var(--primary)}
.tile.out{opacity:.55}
.cart{position:fixed;left:0;right:0;bottom:0;max-height:90vh;z-index:46;background:#fff;border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .26s ease;box-shadow:0 -12px 40px rgba(6,24,27,.25)}
.cart.open{transform:none}
.cart-scrim{position:fixed;inset:0;z-index:45;background:rgba(6,24,27,.5);display:none}
.cart-scrim.on{display:block}
.cart-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cart-head .brandmini{display:flex;align-items:center;gap:10px;min-width:0}
.cart-head .brandmini .ml{width:34px;height:34px;border-radius:50%;background:var(--primary-50);display:grid;place-items:center;color:var(--primary);overflow:hidden;flex:none}
.cart-head .brandmini img{width:100%;height:100%;object-fit:cover}
.cart-head .sn{font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-lines{overflow:auto;flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.cart-foot{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#FAFCFC;border-radius:0 0 20px 20px}
.cl{border:1px solid var(--line);border-radius:14px;padding:10px}
.cl-top{display:flex;gap:10px;align-items:center}
.cl-top .thumb{width:44px;height:44px}
.cl-name{flex:1;min-width:0}
.cl-name .pname{font-size:15px}
.cl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cl-grid label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:3px}
.cl-grid .val{min-height:40px;display:flex;align-items:center;font-weight:600}
.stepper{display:grid;grid-template-columns:40px 1fr 40px;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{min-height:40px;font-size:20px;font-weight:600;color:var(--primary)}
.stepper button:hover{background:var(--primary-50)}
.stepper input{width:100%;min-width:0;text-align:center;border:0;outline:none;font-weight:600;min-height:40px;background:#fff}
.disc{display:grid;grid-template-columns:1fr 62px;gap:6px}
.disc .inp,.disc select{min-height:40px}
.cl-total{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.cl-total b{font-size:17px;color:var(--text)}
.sumrow{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted);font-size:14.5px}
.sumrow.big{color:var(--text);font-size:22px;font-weight:700;padding:8px 0 12px}
.cart-fab{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:44;min-height:54px;border-radius:14px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:600;box-shadow:0 8px 24px rgba(6,24,27,.3)}
.cart-fab .cnt{display:inline-flex;align-items:center;gap:8px}
.cart-fab .n{background:var(--brass);color:#2A2007;min-width:24px;height:24px;border-radius:12px;display:inline-grid;place-items:center;font-size:13px;padding:0 6px}
.cart-fab.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.03)}}
@media (max-width:1023px){.pos-main{padding-bottom:78px}}
@media (min-width:1024px){
  .pos{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:20px;align-items:start}
  .cart{position:sticky;top:20px;bottom:auto;transform:none;max-height:calc(100vh - 40px);border:1px solid var(--line);border-radius:16px;box-shadow:none;z-index:1}
  .cart-foot{border-radius:0 0 16px 16px}
  .cart-fab,.cart-scrim,.cart .only-sheet{display:none!important}
}

/* ---------- modal / toast ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(6,24,27,.55);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:18px;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(6,24,27,.4);animation:pop .18s ease-out}
.modal.wide{width:min(720px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 12px 10px 20px;border-bottom:1px solid var(--line)}
.modal-b{padding:18px 20px;overflow:auto;-webkit-overflow-scrolling:touch}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@media (max-width:640px){
  .scrim{align-items:flex-end;padding:0}
  .modal,.modal.wide{width:100%;border-radius:20px 20px 0 0;max-height:94vh;animation:sheet .22s ease-out}
  .modal-f .btn{flex:1}
}
@keyframes sheet{from{transform:translateY(60px);opacity:.6}}
#toastRoot{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:500;max-width:min(520px,100%);box-shadow:0 10px 30px rgba(6,24,27,.35);border-left:5px solid var(--ok);opacity:0;transform:translateY(12px);transition:all .22s}
.toast.in{opacity:1;transform:none}
.toast.err{border-left-color:#FF7A6B} .toast.warn{border-left-color:var(--brass)}
body.has-fab #toastRoot{bottom:calc(88px + env(safe-area-inset-bottom))}

/* skeleton */
.skel{border-radius:16px;background:linear-gradient(90deg,#E8EEEE 25%,#F2F6F6 40%,#E8EEEE 60%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* receipt / print */
.receipt{font-size:14px;color:#111}
.rc-head{text-align:center;padding-bottom:10px;border-bottom:1px dashed #999}
.rc-head img{width:56px;height:56px;border-radius:50%;object-fit:cover;margin:0 auto 6px}
.rc-head b{font-size:18px;display:block}
.rc-meta{display:flex;justify-content:space-between;gap:8px;padding:8px 0;font-size:13px;color:#444;flex-wrap:wrap}
.receipt table{width:100%;border-collapse:collapse}
.receipt th{font-size:12.5px;text-align:left;padding:5px 0;border-bottom:1px solid #bbb}
.receipt td{padding:5px 0;vertical-align:top;border-bottom:1px dotted #ccc}
.receipt .r{text-align:right;white-space:nowrap}
.rc-tot{margin-top:8px}
.rc-tot div{display:flex;justify-content:space-between;padding:2px 0}
.rc-tot .g{font-size:17px;font-weight:700;border-top:1px solid #999;margin-top:4px;padding-top:6px}
.rc-foot{text-align:center;margin-top:12px;font-size:13px;color:#555}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;width:76mm;margin:0 auto}
  body{background:#fff}
  @page{margin:6mm}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.lrow .thumb{width:40px;height:40px}
@media (min-width:900px){.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media print{#printArea.wide{width:auto;max-width:190mm}}

/* ---------- অফলাইন / সিঙ্ক ---------- */
.nav-foot{padding:10px 10px 12px}
.sync-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 12px;border-radius:10px;color:#C9DADB;font-size:13.5px;text-align:left}
.sync-btn:hover{background:rgba(255,255,255,.07)}
.sync-dot{width:10px;height:10px;border-radius:50%;background:#8FA3A6;flex:none}
.sync-btn[data-k=ok] .sync-dot{background:#3DD68C}
.sync-btn[data-k=warn] .sync-dot{background:#F5B942}
.sync-btn[data-k=bad] .sync-dot{background:#FF7A6B}
.sync-btn[data-k=busy] .sync-dot{background:transparent;border:2px solid #F5B942;border-top-color:transparent;animation:spin .8s linear infinite}
.topbar .t-shop{display:none}
.topbar .sync-btn{width:auto;margin-left:auto;margin-right:6px;color:var(--text);background:#EEF3F3;min-height:36px;padding:0 12px 0 10px;font-weight:500;max-width:62%}
.topbar .sync-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setup{position:fixed;inset:0;z-index:95;background:var(--ink);overflow:auto;display:grid;place-items:center;padding:18px}
.setup-card{background:#fff;border-radius:20px;width:min(540px,100%);padding:24px 22px}
.setup-card .dialmini{width:56px;height:56px;color:var(--brass);background:var(--ink);border-radius:50%;padding:8px;margin-bottom:12px}
.setup-card ol{margin:10px 0 16px 20px;color:#3A4E53}
.setup-card li{margin:4px 0}
.op-row{padding:10px 0;border-bottom:1px solid var(--line)}
.op-row:last-child{border-bottom:0}
.op-row .err{color:var(--bad);font-size:13.5px;margin-top:2px}
.op-acts{display:flex;gap:8px;margin-top:8px}
@media print{.sync-btn{display:none!important}}
.searchbar .scanbtn{position:absolute;right:2px;min-height:38px;min-width:38px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center}
.searchbar.big .scanbtn{right:4px;min-height:44px;min-width:44px}
.searchbar:has(.scanbtn) .inp{padding-right:52px}
.searchbar.big:has(.scanbtn) .inp{padding-right:58px}
.scancard{background:#000;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:4/3;max-height:60vh}
.scancard video{width:100%;height:100%;object-fit:cover;display:block}
.scancard .frame{position:absolute;inset:14%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.scancard .torch{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.9);border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:0}
.scancard .torch.on{background:var(--brass);color:#fff}
.scan-hint{text-align:center;color:var(--muted);font-size:13.5px;margin-top:10px}
.scan-found{display:flex;align-items:center;gap:12px;margin-top:12px}
</style>

<script>
(function(){
'use strict';

/* =====================================================================
   ছোট সহায়ক ফাংশন
   ===================================================================== */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BND='০১২৩৪৫৬৭৮৯';
const bn=v=>String(v).replace(/\d/g,d=>BND[d]);
const en=s=>String(s==null?'':s).replace(/[০-৯]/g,d=>BND.indexOf(d));
const nf=n=>(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const qn=n=>bn(nf(n));
const money=n=>{n=Number(n)||0;return (n<0?'−':'')+'৳ '+bn(nf(Math.abs(n)));};
const norm=s=>String(s==null?'':s).normalize('NFC').toLowerCase().trim();
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const pn=v=>{const s=en(v).replace(/[,\s৳]/g,'');return s===''?NaN:Number(s);};
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);
const uniq=a=>Array.from(new Set(a.filter(Boolean)));
const COL=new Intl.Collator('bn');
const MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const DAYS=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const fdate=s=>{s=String(s||'').slice(0,10).split('-');return s.length===3?bn(s[2]+'-'+s[1]+'-'+s[0]):'';};
const fdt=s=>{s=String(s||'');return fdate(s)+(s.length>=16?' '+bn(s.slice(11,16)):'');};
const longDate=s=>{const p=String(s).split('-').map(Number);if(p.length<3)return '';const d=new Date(p[0],p[1]-1,p[2]);return DAYS[d.getDay()]+', '+bn(p[2])+' '+MONTHS[p[1]-1]+' '+bn(p[0]);};
const greeting=()=>{const h=new Date().getHours();return h>=5&&h<12?'শুভ সকাল':h>=12&&h<15?'শুভ মধ্যাহ্ন':h>=15&&h<18?'শুভ অপরাহ্ন':h>=18&&h<20?'শুভ সন্ধ্যা':'শুভ রাত্রি';};
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};

const ICONS={
  dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  plusb:'<path d="M12 5v14M5 12h14"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 8H6"/>',
  wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2Z"/><circle cx="16.5" cy="14.5" r="1"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9a2.5 2.5 0 0 0-2.5-1.5c-1.4 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2A2.7 2.7 0 0 1 9.5 15M12 6v1.5M12 16.5V18"/>',
  chart:'<path d="M4 20V4M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-8"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
  edit:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  watch:'<circle cx="12" cy="12" r="5.5"/><path d="M12 9.5V12l1.8 1.2M9 6.5 9.6 3h4.8L15 6.5M9 17.5 9.6 21h4.8l.6-3.5"/>',
  image:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  print:'<path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7" rx="1"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/>',
  alert:'<path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4M12 17.5v.01"/>',
  trend:'<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  down:'<path d="m3 7 6 6 4-4 8 8"/><path d="M15 17h6v-6"/>',
  flag:'<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',
  scan:'<path d="M4 7V5a1 1 0 0 1 1-1h2M20 7V5a1 1 0 0 1-1-1h-2M4 17v2a1 1 0 0 0 1 1h2M20 17v2a1 1 0 0 1-1 1h-2M3 12h18"/>',
  sheet:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/>'
};
const ico=(n,s)=>'<svg class="ic" width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';

/* =====================================================================
   State + সার্ভার কল
   ===================================================================== */
const S={
  settings:{},products:[],dash:null,dashDirty:false,today:'',page:'dashboard',nav:0,
  pl:{q:'',f:'all',limit:50},
  pos:{q:'',cart:[],token:null,saving:false,limit:48},
  exp:null,sav:null,st:{mode:'add'},
  rep:{tab:'sum',from:'',to:'',q:'',data:null,limit:150}
};
const view=$('#view');
const H={},I={},C={},SUB={};

let busyN=0;
function busy(d){busyN=Math.max(0,busyN+d);$('#bar').classList.toggle('on',busyN>0);}
/* অফলাইন ইঞ্জিন: Code.gs-এর ফাংশন এখন ব্রাউজারেই চলে (google.script.run-এর বদলে) */
function api(fn){
  const args=Array.prototype.slice.call(arguments,1);
  busy(1);
  return Engine.call(fn,args).then(res=>{
    busy(-1);
    if(res&&res.ok)return res.data;
    throw new Error((res&&res.error)||'অজানা ত্রুটি হয়েছে');
  },err=>{busy(-1);throw err;});
}

/* =====================================================================
   UI: toast / modal / button busy
   ===================================================================== */
function toast(msg,type){
  const root=$('#toastRoot');
  while(root.children.length>=3)root.firstChild.remove();
  const el=document.createElement('div');
  el.className='toast '+(type||'ok');el.textContent=msg;root.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('in'));
  setTimeout(()=>{el.classList.remove('in');setTimeout(()=>el.remove(),260);},type==='err'?5200:2800);
}
let CF=null;
function openModal(o){
  closeModal(true);
  const el=document.createElement('div');
  el.className='scrim';el.dataset.act='modalBg';
  el.innerHTML='<div class="modal '+(o.cls||'')+'" role="dialog" aria-modal="true"><div class="modal-h"><h3>'+o.title+'</h3><button class="icon-btn sm" data-act="closeModal" aria-label="বন্ধ করুন">'+ico('x')+'</button></div><div class="modal-b">'+o.body+'</div>'+(o.foot?'<div class="modal-f">'+o.foot+'</div>':'')+'</div>';
  $('#modalRoot').appendChild(el);
  document.body.classList.add('noscroll');
  if(!o.noFocus&&matchMedia('(hover:hover)').matches){const f=$('input:not([disabled]):not([type=file]):not([type=date]),select',el);if(f)f.focus();}
  return el;
}
function closeModal(keepCf){
  if(window.__scanStop){try{window.__scanStop();}catch(e){}window.__scanStop=null;}
  $('#modalRoot').innerHTML='';document.body.classList.remove('noscroll');
  if(!keepCf&&CF){const f=CF;CF=null;f(false);}
}
function confirmBox(msg,okLabel){
  return new Promise(res=>{
    openModal({title:'নিশ্চিত করুন',body:'<p>'+esc(msg)+'</p>',noFocus:true,
      foot:'<button class="btn" data-act="cfNo">না, থাক</button><button class="btn danger" data-act="cfYes">'+(okLabel||'হ্যাঁ')+'</button>'});
    CF=res;
  });
}
H.cfYes=()=>{const f=CF;CF=null;closeModal(true);if(f)f(true);};
H.cfNo=()=>{const f=CF;CF=null;closeModal(true);if(f)f(false);};
H.closeModal=()=>closeModal();
H.modalBg=(t,e)=>{if(e.target===t)closeModal();};

async function busyBtn(btn,fn){
  if(btn&&btn.disabled)return;
  if(btn){btn.disabled=true;btn.classList.add('loading');}
  try{return await fn();}
  finally{if(btn){btn.disabled=false;btn.classList.remove('loading');}}
}
const submitBtn=f=>$('[type=submit][form="'+f.id+'"]')||$('[type=submit]',f);

/* ছবি ছোট করা (মোবাইলের বড় ছবি আপলোডের আগেই কমিয়ে নেয়) */
function compress(file,max,type,q){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      try{
        const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
        const w=Math.max(1,Math.round(im.naturalWidth*sc)),h=Math.max(1,Math.round(im.naturalHeight*sc));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        const cx=cv.getContext('2d');
        if(type==='image/jpeg'){cx.fillStyle='#fff';cx.fillRect(0,0,w,h);}
        cx.drawImage(im,0,0,w,h);
        const out=cv.toDataURL(type,q);
        URL.revokeObjectURL(url);
        resolve({data:out.split(',')[1],mime:type,preview:out});
      }catch(e){reject(e);}
    };
    im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('ছবিটি পড়া যায়নি, অন্য ছবি চেষ্টা করুন'));};
    im.src=url;
  });
}
function imgPicker(id,inner,kind){
  return '<div class="imgpick" id="'+id+'" data-kind="'+(kind||'product')+'"><div class="imgprev">'+inner+'</div><div class="imgact"><label class="btn sm"><input type="file" accept="image/*" hidden data-ch="pickImg" data-target="'+id+'">'+ico('image',18)+' ছবি বাছুন / তুলুন</label><span class="hint">ক্যামেরা বা গ্যালারি থেকে দিন — ছবি নিজে থেকেই ছোট হয়ে Google Drive-এ জমা হবে</span></div></div>';
}
C.pickImg=async t=>{
  const f=t.files&&t.files[0];if(!f)return;
  const box=$('#'+t.dataset.target),logo=box.dataset.kind==='logo';
  try{
    const im=await compress(f,logo?360:900,logo?'image/png':'image/jpeg',.82);
    box._img={data:im.data,mime:im.mime};
    $('.imgprev',box).innerHTML='<img src="'+im.preview+'" alt="">';
  }catch(e){toast(e.message,'err');}

function filterP(q,f){
  const words=norm(en(q)).split(/\s+/).filter(Boolean);
  return S.products.filter(p=>{
    if(f==='low'&&!(p.stock>0&&p.stock<=p.low))return false;
    if(f==='out'&&p.stock>0)return false;
    return words.every(w=>p._w.includes(w));
  });
}
function sortP(list,s){
  const a=list.slice();
  if(s==='name')a.sort((x,y)=>COL.compare(x.name,y.name));
  else if(s==='stockAsc')a.sort((x,y)=>x.stock-y.stock);
  else if(s==='stockDesc')a.sort((x,y)=>y.stock-x.stock);
  else if(s==='price')a.sort((x,y)=>y.price-x.price);
  return a;
}

/* =====================================================================

   ===================================================================== */
function lineCalc(p,l){                       // সার্ভারের calcLine_ এর মতোই
  let d=Number(l.disc);if(!isFinite(d)||d<0)d=0;
  const per=r2(l.dtype==='percent'?p.price*Math.min(d,100)/100:Math.min(d,p.price));
  const net=r2(p.price-per);
  return {per:per,net:net,total:r2(net*l.qty),cost:r2((p.purchase+p.cost)*l.qty)};
}
function cartCalc(){
  S.pos.cart=S.pos.cart.filter(l=>getP(l.id));
  let sub=0,disc=0,total=0,qty=0;
  const lines=S.pos.cart.map(l=>{
    const p=getP(l.id),c=lineCalc(p,l);
    sub+=p.price*l.qty;disc+=c.per*l.qty;total+=c.total;qty+=l.qty;
    return {l:l,p:p,c:c};
  });
  return {lines:lines,sub:r2(sub),disc:r2(disc),total:r2(total),qty:qty};
}

function closeCart(){const c=$('#cart'),s=$('#cartScrim');if(c)c.classList.remove('open');if(s)s.classList.remove('on');}
H.cartOpen=()=>{$('#cart').classList.add('open');$('#cartScrim').classList.add('on');};
H.cartClose=closeCart;
function setQty(id,q){
  const l=S.pos.cart.find(x=>x.id===id),p=getP(id);if(!l||!p)return;
  if(q>p.stock){toast('স্টকে আছে মাত্র '+qn(p.stock)+' টি','warn');q=p.stock;}
  if(q<1){S.pos.cart=S.pos.cart.filter(x=>x.id!==id);}else l.qty=q;
  renderCart();
}
H.cPlus=t=>{const l=S.pos.cart.find(x=>x.id===t.dataset.id);if(l)setQty(l.id,l.qty+1);};
H.cMinus=t=>{const l=S.pos.cart.find(x=>x.id===t.dataset.id);if(l)setQty(l.id,l.qty-1);};
H.cDel=t=>{S.pos.cart=S.pos.cart.filter(x=>x.id!==t.dataset.id);renderCart();};
H.cClear=async()=>{if(await confirmBox('কার্টের সব প্রোডাক্ট সরিয়ে ফেলবেন?','হ্যাঁ, খালি করুন')){S.pos.cart=[];S.pos.token=null;renderCart();closeCart();}};
C.cQty=t=>{const q=Math.floor(pn(t.value));setQty(t.dataset.id,isNaN(q)?1:q);};
C.cDisc=t=>{
  const l=S.pos.cart.find(x=>x.id===t.dataset.id);if(!l)return;
  const v=pn(t.value);l.disc=(isNaN(v)||v<0)?0:v;renderCart();
};
C.cDType=t=>{const l=S.pos.cart.find(x=>x.id===t.dataset.id);if(l){l.dtype=t.value==='percent'?'percent':'amount';renderCart();}};

/* বিক্রি সম্পন্ন */
let lastReceipt='';
H.sell=async t=>{
  const K=cartCalc();
  if(!K.lines.length){toast('কার্ট খালি আছে','warn');return;}
  if(S.pos.saving)return;
  S.pos.saving=true;
  if(!S.pos.token)S.pos.token=uid();
  const items=K.lines.map(x=>({id:x.l.id,qty:x.l.qty,disc:x.l.disc||0,dtype:x.l.dtype}));
  try{
    await busyBtn(t,async()=>{
      const res=await api('createSale',{token:S.pos.token,items:items});
      Object.keys(res.stock||{}).forEach(id=>{const p=getP(id);if(p)p.stock=res.stock[id];});
      S.pos.cart=[];S.pos.token=null;S.dashDirty=true;S.rep.data=null;S.pf.data=null;S.cb=null;
      closeCart();updateNavBadge();
      if(S.page==='pos'){renderPGrid();renderCart();}
      showReceipt(res);
      if(res.duplicate)toast('এই বিক্রিটি আগেই সেভ হয়ে গিয়েছিল','warn');
    });
  }catch(e){
    toast(e.message,'err');
    if(/স্টক|পাওয়া যায়নি/.test(e.message))refreshProducts(true).then(()=>{if(S.page==='pos'){renderPGrid();renderCart();}});
  }finally{S.pos.saving=false;const b=$('#sellBtn');if(b)b.disabled=!S.pos.cart.length;}
};
function receiptHTML(s){
  const st=S.settings||{};
  const rows=s.items.map(i=>'<tr><td>'+esc(i.name)+'</td><td class="r">'+qn(i.qty)+'</td><td class="r">'+qn(i.net)+'</td><td class="r">'+qn(i.total)+'</td></tr>').join('');
  return '<div class="receipt"><div class="rc-head">'+(st.logoId?'<img src="'+thumbUrl(st.logoId,120)+'" alt="">':'')+'<b>'+esc(st.shopName||'')+'</b>'+(st.shopAddress?'<span>'+esc(st.shopAddress)+'</span>':'')+'</div>'+
    '<div class="rc-meta"><span>রসিদ: '+bn(s.saleId)+'</span><span>'+fdt(s.date)+'</span></div>'+
    '<table><thead><tr><th>প্রোডাক্ট</th><th class="r">পরিমাণ</th><th class="r">দর</th><th class="r">মোট</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="rc-tot"><div><span>সাবটোটাল</span><span>'+money(s.subtotal)+'</span></div>'+(s.discount>0?'<div><span>মোট ছাড়</span><span>− '+money(s.discount)+'</span></div>':'')+'<div class="g"><span>সর্বমোট</span><span>'+money(s.total)+'</span></div></div>'+
    '<div class="rc-foot">ধন্যবাদ! আবার আসবেন।</div></div>';
}
function showReceipt(s){
  lastReceipt=receiptHTML(s);
  openModal({title:'✓ বিক্রি সম্পন্ন — '+money(s.total),noFocus:true,body:lastReceipt,
    foot:'<button class="btn" data-act="printReceipt">'+ico('print',18)+' রসিদ প্রিন্ট</button><button class="btn primary" data-act="closeModal">নতুন বিক্রি</button>'});
}
function doPrint(html,wide){
  const a=$('#printArea');
  a.className=wide?'wide':'';a.innerHTML=html;
  setTimeout(()=>{try{window.print();}catch(e){toast('প্রিন্ট করা যায়নি','err');}},60);
}
H.printReceipt=()=>doPrint(lastReceipt,false);

    '<div class="searchbar big" style="margin-bottom:12px"><input class="inp" id="sq" data-in="sq" type="text" enterkeyhint="search" placeholder="যেমন: লেডিস চেইন…" autocomplete="off" value="'+esc(q.q)+'">'+ico('search',20)+'<button class="icon-btn sm" data-act="sqClear" id="sqX" aria-label="মুছুন"'+(q.q?'':' hidden')+'>'+ico('x',18)+'</button>'+scanBtn('sq','search')+'</div>'+

      '<div class="fld"><label>সর্বোচ্চ</label><input class="inp" id="sqMax" data-in="sqP" inputmode="decimal" autocomplete="off" value="'+esc(q.max)+'" placeholder="যেকোনো"></div>'+

function renderSQ(){
  const box=$('#sqRes');if(!box)return;
  const q=S.sq,lo=pn(q.min),hi=pn(q.max),t=norm(en(q.q));
  const list=filterP(q.q,q.f).filter(p=>(isNaN(lo)||p.price>=lo)&&(isNaN(hi)||p.price<=hi));
  const rank=p=>(t&&norm(p.name).startsWith(t))?0:1;
  list.sort((a,b)=>rank(a)-rank(b)||COL.compare(a.name,b.name));
  $('#sqCount').textContent=qn(list.length)+' টি প্রোডাক্ট পাওয়া গেছে';
  if(!list.length){box.innerHTML=emptyBox('search',S.products.length?'কিছু পাওয়া যায়নি — অন্য শব্দ বা দামের সীমা চেষ্টা করুন':'এখনও কোনো প্রোডাক্ট নেই');return;}
  const shown=list.slice(0,q.limit);
  box.innerHTML='<div class="card" style="padding:6px 16px">'+shown.map(p=>
    '<div class="lrow"><button data-act="pView" data-id="'+esc(p.id)+'" aria-label="বিস্তারিত">'+pimg(p,'',100)+'</button>'+
    '<div class="grow"><div class="pname">'+esc(p.name)+'</div><div class="hint">'+esc([p.id,p.category,p.size].filter(Boolean).join(' · '))+'</div><div style="margin-top:2px"><b>'+money(p.price)+'</b> · '+stockBox(p)+'</div></div>'+
    '<div class="row" style="flex-wrap:nowrap;gap:6px"><button class="btn sm" data-act="pSell" data-id="'+esc(p.id)+'"'+(p.stock<=0?' disabled':'')+'>বিক্রি</button><button class="btn sm" data-act="pStock" data-id="'+esc(p.id)+'">স্টক</button></div></div>').join('')+'</div>'+
    (list.length>shown.length?'<div class="more"><button class="btn" data-act="sqMore">আরও দেখান ('+qn(list.length-shown.length)+' টি বাকি)</button></div>':'');
}
I.sq=debounce(t=>{S.sq.q=t.value;S.sq.limit=60;const x=$('#sqX');if(x)x.hidden=!t.value;renderSQ();},120);
I.sqP=debounce(()=>{S.sq.min=$('#sqMin').value;S.sq.max=$('#sqMax').value;S.sq.limit=60;renderSQ();},200);

H.sqClear=()=>{S.sq.q='';R.search();const i=$('#sq');if(i)i.focus();};
H.sqMore=()=>{S.sq.limit+=60;renderSQ();};

const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
function quickRange(k){
  const t=S.today,y=+t.slice(0,4),m=+t.slice(5,7);
  if(k==='today')return [t,t];
  if(k==='yest'){const d=addDays(t,-1);return [d,d];}
  if(k==='w7')return [addDays(t,-6),t];
  if(k==='month')return [t.slice(0,8)+'01',t];
  if(k==='last')return [new Date(Date.UTC(y,m-2,1)).toISOString().slice(0,10),new Date(Date.UTC(y,m-1,0)).toISOString().slice(0,10)];
  return [t.slice(0,8)+'01',t];
}
const QUICK=[['today','আজ'],['yest','গতকাল'],['w7','৭ দিন'],['month','এই মাস'],['last','গত মাস']];

function findByCode(text){
  const t=String(text||'').trim(),key=norm(t);
  return S.products.find(p=>p.barcode&&norm(p.barcode)===key)||S.products.find(p=>p.id===t)||null;
}
function scanFoundHTML(p,text){
  if(!p)return '<div class="scan-hint neg-c">"'+esc(text)+'" — এই বারকোডের কোনো প্রোডাক্ট পাওয়া যায়নি</div>';
  return '<div class="scan-found">'+pimg(p,'',100)+'<div class="grow"><div class="pname">'+esc(p.name)+'</div><div class="hint">'+money(p.price)+' · '+stockBox(p)+'</div></div></div>';
}
H.scanOpen=async t=>{
  if(!window.BarcodeScan){toast('বারকোড স্ক্যানার লোড হয়নি','err');return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('এই ব্রাউজারে ক্যামেরা স্ক্যান করা যায় না','err');return;}
  const target=t.dataset.target,mode=t.dataset.mode;
  let ctrl=null,done=false;
  openModal({title:'বারকোড স্ক্যান করুন',noFocus:true,
    body:'<div class="scancard"><video id="scanVideo" autoplay muted playsinline></video><div class="frame"></div><button type="button" class="torch" id="scanTorch" hidden aria-label="ফ্ল্যাশ">'+ico('alert',18)+'</button></div><div id="scanMsg" class="scan-hint">ক্যামেরা চালু হচ্ছে…</div><div id="scanResult"></div>',
    foot:'<button class="btn" data-act="closeModal">বন্ধ করুন</button>'});
  window.__scanStop=()=>{if(ctrl)ctrl.stop();};
  try{
    ctrl=await BarcodeScan.startCamera($('#scanVideo'),(r)=>{
      if(done)return;
      const p=findByCode(r.text);
      $('#scanMsg').textContent='পাওয়া গেছে: '+r.text;
      $('#scanResult').innerHTML=scanFoundHTML(p,r.text);
      if(!p){if(navigator.vibrate)navigator.vibrate(80);return;}
      done=true;if(navigator.vibrate)navigator.vibrate([40,40,40]);
      setTimeout(()=>{
        closeModal();
        if(mode==='pos'){addCart(p.id);toast('“'+p.name+'” কার্টে যোগ হয়েছে');}
        else{
          const inp=$('#'+target);if(inp){inp.value=p.name;}
          if(target==='plq'){S.pl.q=p.name;S.pl.limit=60;R.products();}
          else if(target==='stq'){S.stl.q=p.name;S.stl.limit=80;R.stock();}
          else if(target==='sq'){S.sq.q=p.name;S.sq.limit=60;R.search();}
        }
      },500);
    });
    if($('#scanMsg'))$('#scanMsg').textContent='বারকোডের ওপর ক্যামেরা ধরুন';
    if(ctrl.torchSupported){
      const tb=$('#scanTorch');tb.hidden=false;let on=false;
      tb.onclick=async()=>{on=await ctrl.setTorch(!on);tb.classList.toggle('on',on);};
    }
  }catch(e){
    if($('#scanMsg'))$('#scanMsg').innerHTML='<span class="neg-c">'+esc(e.message)+'</span>';
  }
};

/* =====================================================================
   অফলাইন / সিঙ্ক
   ===================================================================== */
S.booted=false;
const ago=ms=>{
  if(!ms)return '';
  const m=Math.round((Date.now()-ms)/60000);
  if(m<1)return 'এইমাত্র';
  if(m<60)return bn(m)+' মিনিট আগে';
  const h=Math.round(m/60);
  if(h<24)return bn(h)+' ঘণ্টা আগে';
  return bn(Math.round(h/24))+' দিন আগে';
};
const fts=ms=>bn(new Date(ms).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Dhaka'}));
function syncInfo(){
  const s=Engine.status();
  if(!s.configured)return {k:'off',t:'সংযোগ দেওয়া নেই',s:s};
  if(s.syncing)return {k:'busy',t:'সিঙ্ক হচ্ছে…',s:s};
  if(s.failed.length)return {k:'bad',t:bn(s.failed.length)+'টি কাজ সিঙ্ক হয়নি',s:s};
  if(!s.online)return {k:'off',t:'অফলাইন'+(s.pending?' · '+bn(s.pending)+'টি বাকি':' · ডাটা সংরক্ষিত'),s:s};
  if(s.lastError)return {k:'bad',t:'সিঙ্ক হয়নি — আবার চেষ্টা হবে',s:s};
  if(s.pending)return {k:'warn',t:bn(s.pending)+'টি সিঙ্কের অপেক্ষায়',s:s};
  return {k:'ok',t:'সিঙ্ক হয়েছে'+(s.lastSync?' · '+ago(s.lastSync):''),s:s};
}
function renderSync(){
  if(!window.Engine)return;
  const i=syncInfo();
  $$('.sync-btn').forEach(b=>{b.dataset.k=i.k;const t=$('.sync-txt',b);if(t)t.textContent=i.t;});
  const body=$('#syncBody');if(body)body.innerHTML=syncBodyHTML();
}
window.renderSync=renderSync;

function opLabel(f){
  const a=f.args||[],x=a[0]||{};
  switch(f.fn){
    case 'createSale':return 'বিক্রি: '+(x.items||[]).map(i=>{const p=getP(i.id);return (p?p.name:i.id)+' × '+bn(i.qty);}).join(', ');
    case 'createProduct':return 'নতুন প্রোডাক্ট: '+x.name;
    case 'updateProduct':return 'প্রোডাক্ট সম্পাদনা: '+x.name;
    case 'updateStock':{const p=getP(String(a[0]));return 'স্টক '+((a[1]>0)?'যোগ':'কমানো')+': '+(p?p.name:a[0])+' ('+bn(Math.abs(a[1]))+' টি)';}
    case 'createExpense':return 'খরচ: '+x.category+' — '+money(x.amount);
    case 'createSaving':return 'সঞ্চয়: '+money(x.amount);
    case 'saveSettings':return 'সেটিংস পরিবর্তন';
    default:return f.fn;
  }
}
function syncBodyHTML(){
  const i=syncInfo(),s=i.s;
  const failed=s.failed.map(f=>'<div class="op-row"><div><b>'+esc(opLabel(f))+'</b></div><div class="hint">'+fts(f.ts)+'</div><div class="err">'+esc(f.error)+'</div>'+
    '<div class="op-acts"><button class="btn sm" data-act="opRetry" data-id="'+esc(f.opId)+'">আবার চেষ্টা</button><button class="btn sm danger" data-act="opDrop" data-id="'+esc(f.opId)+'">বাদ দিন</button></div></div>').join('');
  return '<dl class="dl" style="margin-top:0"><dt>অবস্থা</dt><dd>'+esc(i.t)+'</dd><dt>ইন্টারনেট</dt><dd>'+(s.online?'আছে':'নেই')+'</dd><dt>সিঙ্কের অপেক্ষায়</dt><dd>'+qn(s.pending)+' টি কাজ</dd>'+
    '<dt>শেষ সিঙ্ক</dt><dd>'+(s.lastSync?fts(s.lastSync):'—')+'</dd></dl>'+
    (s.lastError?'<p class="neg-c" style="margin-top:10px">'+esc(s.lastError)+'</p>':'')+
    (s.failed.length?'<h3 style="margin:18px 0 4px">সিঙ্ক হয়নি এমন কাজ</h3><p class="hint">অন্য ডিভাইসের কাজের সাথে মেলেনি (যেমন স্টক শেষ হয়ে গেছে)। ডাটা ঠিক করে আবার চেষ্টা করুন, অথবা বাদ দিন।</p>'+failed:'')+
    '<p class="hint" style="margin-top:14px">ইন্টারনেট থাকলে অ্যাপ নিজে থেকেই সিঙ্ক করে — কিছু করতে হয় না।</p>';
}
H.syncPanel=()=>{
  if(!Engine.status().configured){toast('আগে সার্ভারের সাথে সংযোগ দিন','warn');return;}
  openModal({title:'সিঙ্কের অবস্থা',noFocus:true,body:'<div id="syncBody">'+syncBodyHTML()+'</div>',
    foot:'<button class="btn" data-act="closeModal">বন্ধ করুন</button><button class="btn primary" data-act="syncNow">'+ico('refresh',18)+' এখনই সিঙ্ক করুন</button>'});
};
H.syncNow=async t=>{
  await busyBtn(t,async()=>{
    const r=await Engine.syncNow();
    if(r.skipped==='offline')toast('ইন্টারনেট নেই — সংযোগ এলে নিজে থেকেই সিঙ্ক হবে','warn');
    else if(r.skipped==='busy')toast('সিঙ্ক আগে থেকেই চলছে','warn');
    else if(r.error)toast(r.error,'err');
    else toast(r.sent||r.changed?'সিঙ্ক সম্পন্ন হয়েছে':'সব ডাটা আপ-টু-ডেট আছে');
  });
};
H.opRetry=t=>{
  const r=Engine.retryFailed(t.dataset.id);
  if(r&&!r.ok)toast(r.error||'আবার চেষ্টা করা গেল না','err');else toast('আবার সিঙ্কের সারিতে দেওয়া হয়েছে');
};
H.opDrop=async t=>{
  if(await confirmBox('এই কাজটি বাদ দিলে এটা আর সার্ভারে যাবে না। বাদ দেবেন?','হ্যাঁ, বাদ দিন'))Engine.discardFailed(t.dataset.id);
};

let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(S.page==='settings')R.settings();});
const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
function barcodeCardHTML(){
  return '<div class="card" style="margin-top:16px"><h2 style="margin-bottom:6px">বারকোড</h2>'+
    '<p class="hint" style="margin-bottom:14px">প্রতিটি প্রোডাক্টের আলাদা বারকোড ছবি (PNG)। ক্যামেরা দিয়ে স্ক্যান করে প্রোডাক্ট খোঁজা যায় সার্চ বক্সের পাশের '+ico('scan',14)+' বাটনে।</p>'+
    '<div class="row"><button class="btn" data-act="dlBarcodes">'+ico('down',18)+' সব বারকোড ছবি ডাউনলোড (ZIP)</button>'+
    '<button class="btn" data-act="genBarcodes">'+ico('refresh',18)+' Google Sheet-এ বারকোড ছবি তৈরি করুন</button></div>'+
    '<p class="hint" style="margin-top:10px">Sheet-এর বাটনের জন্য ইন্টারনেট লাগে; ZIP ডাউনলোড অফলাইনেও কাজ করে।</p></div>';
}
H.dlBarcodes=async t=>{
  if(!S.products.length){toast('কোনো প্রোডাক্ট নেই','warn');return;}
  await busyBtn(t,async()=>{
    try{
      const files=[];
      for(const p of S.products){
        const im=await api('getBarcodeImage',p.id);
        files.push({name:(im.filename||(p.id+'.png')),bytes:Uint8Array.from(atob(im.b64),c=>c.charCodeAt(0))});
      }
      const zip=ZipLite.makeZip(files);
      const url=URL.createObjectURL(new Blob([zip],{type:'application/zip'}));
      const a=document.createElement('a');a.href=url;a.download='barcodes.zip';document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      toast(qn(files.length)+'টি বারকোড ছবি ডাউনলোড হয়েছে');
    }catch(e){toast(e.message,'err');}
  });
};
H.genBarcodes=async t=>{
  await busyBtn(t,async()=>{
    try{const r=await Engine.request('barcodes',{});toast(r.message||'সম্পন্ন হয়েছে');}
    catch(e){toast(e.message,'err');}
  });
};
function syncCardHTML(){
  const i=syncInfo(),cfg=Engine.getConfig()||{url:'',key:''};
  return '<div class="card" style="margin-top:16px"><h2 style="margin-bottom:6px">অফলাইন ও সিঙ্ক</h2>'+
    '<p class="hint" style="margin-bottom:14px">ইন্টারনেট ছাড়াই সব কাজ চলে। ইন্টারনেট এলে কাজগুলো নিজে নিজে আপনার Google Sheet ও Drive-এ চলে যায়।</p>'+
    '<div id="syncBody">'+syncBodyHTML()+'</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn primary" data-act="syncNow">'+ico('refresh',18)+' এখনই সিঙ্ক করুন</button>'+
      '<button class="btn" data-act="redownload">স্থানীয় ডাটা নতুন করে নামান</button>'+
      (deferredInstall?'<button class="btn brass" data-act="installApp">'+ico('plus',18)+' অ্যাপ ইনস্টল করুন</button>':'')+'</div>'+
    (isiOS?'<p class="hint" style="margin-top:10px">iPhone/iPad-এ ইনস্টল: Safari-তে Share বাটন → “Add to Home Screen”।</p>':'')+
    '<h3 style="margin:22px 0 10px">সার্ভারের সংযোগ</h3><form id="reconn" data-sub="reconn" novalidate><div class="fgrid">'+
      fld('Web app URL',true,'<input class="inp" name="url" autocomplete="off" value="'+esc(cfg.url)+'" placeholder="https://script.google.com/macros/s/…/exec">','span2')+
      fld('API Key',true,'<input class="inp" name="key" type="password" autocomplete="off" value="'+esc(cfg.key)+'">','span2')+
    '</div><div class="form-actions"><button class="btn" type="submit">সংযোগ পরীক্ষা করুন ও সংরক্ষণ</button></div></form></div>';
}
SUB.reconn=async f=>{
  const btn=$('[type=submit]',f);
  await busyBtn(btn,async()=>{
    try{const r=await Engine.configure(f.elements.url.value,f.elements.key.value);toast(r.fresh?'নতুন সার্ভার থেকে ডাটা নামানো হয়েছে':'সংযোগ ঠিক আছে');if(S.page==='settings')R.settings();}
    catch(e){toast(e.message,'err');}
  });
};
H.redownload=async t=>{
  if(!await confirmBox('এই ডিভাইসের স্থানীয় ডাটা মুছে Google Sheet থেকে নতুন করে নামানো হবে। (সিঙ্ক না হওয়া কাজ থাকলে এটা করা যাবে না)','হ্যাঁ, নামান'))return;
  await busyBtn(t,async()=>{
    try{await Engine.redownload();toast('ডাটা নতুন করে নামানো হয়েছে');}
    catch(e){toast(e.message,'err');}
  });
};
H.installApp=async()=>{
  if(!deferredInstall)return;
  deferredInstall.prompt();
  try{await deferredInstall.userChoice;}catch(e){}
  deferredInstall=null;if(S.page==='settings')R.settings();
};

/* ---- প্রথমবার সংযোগ ---- */
function showSetup(){
  $('#setupRoot').innerHTML='<div class="setup"><div class="setup-card">'+DIAL.replace('class="dial"','class="dialmini"')+
    '<h1 style="margin-bottom:6px">প্রথমবার সংযোগ</h1>'+
    '<p class="muted">আপনার Google Sheet-এর ডাটা একবার এই ডিভাইসে নামিয়ে আনতে হবে। এরপর ইন্টারনেট ছাড়াই চলবে।'+(navigator.onLine?'':' <b class="neg-c">এখন ইন্টারনেট নেই — প্রথমবার ইন্টারনেট লাগবে।</b>')+'</p>'+
    '<ol><li>Apps Script-এ <b>Api.gs</b> যোগ করে <b>generateApiKey</b> চালান</li><li>Deploy → Web app (Execute as: <b>Me</b>, Who has access: <b>Anyone</b>)</li><li>নিচে Web app URL ও API Key বসান</li></ol>'+
    '<form id="setupForm" data-sub="setup" novalidate><div class="fgrid">'+

SUB.setup=async f=>{
  const btn=$('[type=submit]',f);
  await busyBtn(btn,async()=>{
    try{
      await Engine.configure(f.elements.url.value,f.elements.key.value);
      $('#setupRoot').innerHTML='';

/* ---- সার্ভার থেকে নতুন ডাটা এলে UI হালনাগাদ ---- */
async function onExternalData(){
  if(!S.booted)return;
  try{
    await loadAll();renderSide();refreshView();
    if(S.page==='expense')loadExp();
    else if(S.page==='savings')loadSav();
    else if(S.page==='cash'){renderCash();loadCB();}
    else if(S.page==='reports')loadRep();
    else if(S.page==='profit')loadPF();
  }catch(e){/* পরের সিঙ্কে ঠিক হবে */}
}

/* ---- নিজে নিজে সিঙ্কের ট্রিগার ---- */
function startAuto(){
  if(S.auto)return;S.auto=1;
  window.addEventListener('online',()=>{renderSync();Engine.syncNow();});
  window.addEventListener('offline',renderSync);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderSync();Engine.syncNow();}});
  setInterval(()=>{if(!document.hidden){Engine.syncNow();renderSync();}},90000);
}

/* =====================================================================
   শুরু
   ===================================================================== */
async function loadAll(){
  const d=await api('getAppData');
  S.settings=d.settings;setProducts(d.products);S.dash=d.dashboard;S.today=d.today;
  S.dashDirty=false;S.exp=null;S.sav=null;S.rep.data=null;S.pf.data=null;S.cb=null;
}
async function bootApp(){
  await loadAll();renderSide();S.booted=true;go('dashboard');renderSync();
}
(async function init(){
  try{
    $('#splashMsg').textContent='অফলাইন ইঞ্জিন চালু হচ্ছে…';
    const st=await Engine.init();
    Engine.on('status',renderSync);
    Engine.on('data',onExternalData);
    Engine.on('images',()=>{if(S.booted){renderSide();refreshView();}});
    const sp=$('#splash'),hide=()=>{sp.style.transition='opacity .3s';sp.style.opacity='0';setTimeout(()=>sp.remove(),320);};
    if(!st.configured){hide();showSetup();return;}
    await bootApp();hide();startAuto();
    Engine.cacheImages();Engine.syncNow();
  }catch(e){
    $('#splashMsg').innerHTML=esc(e.message||String(e))+'<br><br><button class="btn brass" data-act="retry">আবার চেষ্টা করুন</button>';
    const h=$('#splash .hand');if(h)h.style.animation='none';
  }
})();

/* ---- অ্যাপ ক্যাশ (Service Worker) ---- */
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;let refreshed=false;
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',async()=>{
    if(!had||refreshed)return;refreshed=true;
    if(await confirmBox('অ্যাপের নতুন সংস্করণ এসেছে। এখন রিলোড করবেন? (আপনার ডাটা নিরাপদ আছে)','রিলোড করুন'))location.reload();
  });
}

})();
